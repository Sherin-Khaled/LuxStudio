<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" >
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" >
    <!-- Static fallback = the Home route's own metadata (see
         client/src/lib/seo/pageMeta.ts). Every route overwrites these tags
         client-side via useSEO on mount, which Googlebot's rendering picks
         up for indexing — but a non-JS fetch (e.g. a social share unfurl
         bot) only ever sees this static markup, so it should read as the
         site's real default rather than a placeholder. True per-route
         static tags would need SSR/prerendering, out of scope for Phase 1. -->
    <title>Lux Studio — UI/UX, Web Design & Development</title>
    <meta name="description" content="Lux Studio is a creative technology studio that designs and builds premium websites, UI/UX, and digital systems for real businesses — from strategy to launch." >
    <meta name="robots" content="index, follow" >
    <meta property="og:title" content="Lux Studio — UI/UX, Web Design & Development" >
    <meta property="og:description" content="Lux Studio is a creative technology studio that designs and builds premium websites, UI/UX, and digital systems for real businesses — from strategy to launch." >
    <meta property="og:type" content="website" >
    <meta name="twitter:card" content="summary_large_image" >
    <meta name="twitter:title" content="Lux Studio — UI/UX, Web Design & Development" >
    <meta name="twitter:description" content="Lux Studio is a creative technology studio that designs and builds premium websites, UI/UX, and digital systems for real businesses — from strategy to launch." >
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" >
    <link rel="alternate icon" type="image/png" href="/favicon.png" >
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Every family the site actually renders (Bricolage Grotesque for
         headings, Inter for body text, JetBrains Mono for eyebrow/mono
         labels, Cairo for Arabic) loaded in one request. This previously
         requested ~45 Google Font families (nearly all unused) plus a
         duplicate CSS @import re-fetching Inter/JetBrains Mono a second
         time — a major first-load cost with no visual benefit. -->
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;500;600;700&family=Cairo:wght@400;500;600;700;800&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=JetBrains+Mono:wght@100..800&display=swap" rel="stylesheet">
    <script>
      // Set lang/dir synchronously, before first paint, so a returning
      // Arabic visitor doesn't see a flash of LTR layout on reload.
      try {
        if (localStorage.getItem("lux-language") === "ar") {
          document.documentElement.lang = "ar";
          document.documentElement.dir = "rtl";
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
